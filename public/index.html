<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peak JCB Dispatch</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><header><div><p class="eyebrow">PEAK JCB</p><h1>Dispatch board</h1><p class="muted">One shared view of every haul, past and future.</p></div><button id="logout" class="ghost hidden">Sign out</button></header><section id="auth" class="card auth"><h2>Sign in to dispatch</h2><form id="authForm"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="8" autocomplete="current-password"></label><button id="authSubmit" type="submit">Sign in</button></form><button id="toggleAuth" class="link">Need an account? Create one</button><p id="authMsg" class="error"></p></section><section id="app" class="hidden"><div class="toolbar"><div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="upcoming">Upcoming</button><button class="filter" data-filter="past">Past</button></div><button id="newTrip">+ New haul</button></div><div id="notice" class="notice hidden"></div><div id="tripList" class="trip-list"></div><section id="editor" class="card hidden"><div class="editor-head"><h2 id="editorTitle">New haul</h2><button id="cancelEdit" class="ghost">Cancel</button></div><form id="tripForm" class="grid"><input type="hidden" id="tripId"><label>Date<input id="tripDate" type="date" required></label><label>Customer<input id="customer" required maxlength="120"></label><label>Pickup<input id="pickup" required maxlength="180"></label><label>Delivery<input id="delivery" required maxlength="180"></label><label>Equipment<input id="equipment" placeholder="JCB 3CX"></label><label>Driver<input id="driver"></label><label>Status<select id="status"><option>Scheduled</option><option>In progress</option><option>Complete</option><option>Cancelled</option></select></label><label class="wide">Notes<textarea id="notes" rows="3"></textarea></label><button class="wide" type="submit">Save haul</button></form></section></section></main><script src="/app.js"></script></body></html>
